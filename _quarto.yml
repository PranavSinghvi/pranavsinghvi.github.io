# _quarto.yml
project:
  type: website

  output-dir: docs
  render:
    - "index.qmd"   # home page
    - "about.qmd"   # about page
    - "now.qmd"     # now page
    - "resume.qmd"  # resume page
    - "pages/"      # page files
    - "!posts/"     # don't render blog posts

  preview:
    port: 1909

website:
  navbar:
    left:
      - href: index.qmd
        text: "Pranav Singhvi"

      - href: now.qmd
        text: Now

      - href: about.qmd
        text: About

      - href: resume.qmd
        text: Resume

      - href: pages/project/page01.qmd
        text: "Housing Story"

    right:
      - icon: github
        href: https://github.com/PranavSinghvi
      - icon: linkedin
        href: https://www.linkedin.com/in/psinghvi05

# format and style
format:
  html:
    theme:
      light:
        - cosmo
        - styles/custom.scss
